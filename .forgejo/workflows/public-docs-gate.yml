name: Public docs gate
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
jobs:
  public-docs:
    runs-on: linux-arm64
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Public docs gate
        run: python3 scripts/public-docs-gate.py
