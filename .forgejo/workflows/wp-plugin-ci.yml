name: WordPress 插件 CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  ci:
    if: github.repository != 'WenPai-org/ci-workflows'
    runs-on: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP Parallel Lint
        run: |
          parallel-lint --exclude vendor --exclude node_modules .

      - name: PHPCS 发布安全与兼容门
        run: |
          phpcs --standard=phpcs.release.xml.dist --report=full .

      - name: PHPCS 全量债务报告（非发布门）
        continue-on-error: true
        run: |
          phpcs --standard=phpcs.xml.dist --report=summary .

      - name: Gitleaks 密钥泄露扫描
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gitleaks detect --source=. --log-opts="$GITHUB_SHA~1..$GITHUB_SHA" --verbose --exit-code 1
          else
            gitleaks detect --source=. --verbose --exit-code 1
          fi
          echo "gitleaks 扫描通过"
