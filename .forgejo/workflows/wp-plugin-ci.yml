name: WordPress 插件 CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  ci:
    if: github.repository != 'WenPai-org/ci-workflows'
    runs-on: linux-arm64
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: PHP Parallel Lint
        run: |
          parallel-lint --exclude vendor --exclude node_modules .

      - name: Install locked development gates
        run: composer install --no-interaction --prefer-source --no-progress

      - name: PHPCS 发布安全与兼容门
        run: vendor/bin/phpcs --standard=phpcs.release.xml.dist --report=full .

      - name: PHPCS 全量债务报告（非发布门）
        continue-on-error: true
        run: |
          vendor/bin/phpcs --standard=phpcs.xml.dist --report=summary .

      - name: Functional regression suite
        run: npm test

      - name: PHPStan level 3
        run: |
          vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --memory-limit=1G --error-format=raw

      - name: Reproducible private release package
        run: |
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          tests/release/build-candidate.sh --version 1.2.4 --output-dir "$output_dir"
          first_sha="$(awk '{print $1}' "$output_dir/wpbridge-1.2.4.zip.sha256")"
          tests/release/build-candidate.sh --version 1.2.4 --output-dir "$output_dir"
          second_sha="$(awk '{print $1}' "$output_dir/wpbridge-1.2.4.zip.sha256")"
          test "$first_sha" = "$second_sha"
          ( cd "$output_dir" && sha256sum -c wpbridge-1.2.4.zip.sha256 )
          unzip -t "$output_dir/wpbridge-1.2.4.zip"

      - name: Gitleaks 密钥泄露扫描
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gitleaks detect --source=. --log-opts="$GITHUB_SHA~1..$GITHUB_SHA" --verbose --exit-code 1
          else
            gitleaks detect --source=. --verbose --exit-code 1
          fi
          echo "gitleaks 扫描通过"
